# 乱世生存官网 - 前端 SPA + FastAPI 后端反代（HTTPS：xqly.xt91tv.shop:23333）
# 2026-09-25 起启用 HTTPS：Let's Encrypt 通配符证书 *.xt91tv.shop（2026-12-24 到期，更新时替换
# /etc/nginx/ssl/ 下两个文件后 nginx -s reload 即可）。NAT 外部 23333 → 内部 80，端口不变。
# 明文 HTTP 禁止：nginx 在 80 上只做 ssl，明文请求触发 497，经 error_page 301 跳转到 https 域名。

server {
    listen 80 ssl default_server;
    listen [::]:80 ssl default_server;

    server_name xqly.xt91tv.shop _;

    ssl_certificate     /etc/nginx/ssl/xt91tv.shop_certificate.pem;
    ssl_certificate_key /etc/nginx/ssl/xt91tv.shop_private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 497 = "The plain HTTP request was sent to HTTPS port"：一律 301 到 HTTPS（等效禁止 http）
    error_page 497 =301 https://xqly.xt91tv.shop:23333$request_uri;

    root /var/www/chaos-web;
    index index.html;

    access_log /var/log/nginx/chaos-web.access.log main;
    error_log  /var/log/nginx/chaos-web.error.log warn;

    # 关闭绝对重定向：让 /admin /wiki 的重定向用相对路径，由浏览器自行拼回端口
    absolute_redirect off;

    # API 反代到本机 FastAPI（2026-09-25 起后端所有接口统一挂 /api 前缀）
    # ^~ 前缀匹配优先于下方静态资源正则，保证 /api/* 全量命中反代
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # 智能客服 KB（2026-09-21 上线，2026-09-25 迁移到 /api/kb/）：SSE 流式接口
    # 必须关缓冲 + HTTP/1.1 空连接头 + 关 gzip（与后端 X-Accel-Buffering: no 两个都要，否则流式变一次性返回）
    # 前缀 location 最长匹配优先，/api/kb/* 全量命中本块
    location ^~ /api/kb/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # 旧路径兼容（勿删）：
    # /health — 外部监控/旧部署门禁仍在用（后端保留 /health 旧路由）
    location = /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # /announcement/uploads/ — 历史公告正文内嵌的旧图片 URL（存量数据兼容，后端保留旧路径别名挂载）
    location ^~ /announcement/uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由 /faction-beta 与 API 前缀同名：精确匹配优先于上面的 API 正则，
    # 页面刷新走 SPA fallback；真实接口子路径（/faction-beta/apply、/my、/admin/*）仍命中正则反代
    location = /faction-beta {
        try_files /index.html =404;
    }

    # 静态资源缓存（含 Minecraft 字体 otf/ttf）
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|otf|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # /admin 和 /wiki 目录重定向：相对路径，浏览器自行保留端口
    location = /admin {
        return 301 /admin/;
    }
    location = /wiki {
        return 301 /wiki/;
    }

    # Wiki cleanUrls：无后缀 clean 链接先命中 xxx.html，再目录；未命中回落 VitePress 404 页
    location /wiki/ {
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /wiki/404.html;
    }

    # SPA fallback：history 路由（/announcements/...）刷新时回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
