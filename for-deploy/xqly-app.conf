# 星穹旅驿官网 · 应用相关 location（生产实际生效）
#
# 位置：服务器 /opt/1panel/www/sites/xqly.xt91tv.shop/proxy/xqly-app.conf
# 由 1panel 静态网站模板生成的 server 块内的
#   include /www/sites/xqly.xt91tv.shop/proxy/*.conf;
# 引入（该 include 行需手工加进 /opt/1panel/www/conf.d/xqly.xt91tv.shop.conf，
# 1panel 的静态网站模板不生成它，也不会生成 SPA 的 try_files 兜底）。
#
# ⚠️ 在 1panel 面板里改动该站点的「网站设置」（域名/证书/端口等）会重新生成
#    conf.d/xqly.xt91tv.shop.conf，include 行会丢失——站点会立刻变成
#    「深层路由 404 + /api 不通」。改完站点设置后必须回来核对这一行。
#
# 仓库内留档：for-deploy/xqly-app.conf（与线上字节一致）。

# 静态资源缓存（含 Minecraft 字体 otf/ttf）；正则 location 优先于 location /，
# 但低于 ^~ /api/ —— 不会截走接口请求
location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?|otf|ttf)$ {
    expires 7d;
    add_header Cache-Control "public";
}

# FLPR-66：robots.txt / sitemap.xml 显式放行（与 web/nginx.conf 同步维护）。
# 精确匹配优先于正则 location，任意 User-Agent 均 200；robots.txt 的
# default_type 兜底 text/plain（验收硬指标，不依赖 mime.types）。
# 声明式策略见 frontend/public/robots.txt；边缘网关放行属 P0，不在本仓库。
location = /robots.txt {
    default_type text/plain;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
location = /sitemap.xml {
    default_type application/xml;
    try_files $uri =404;
}

# FLPR-66：运维信息收口——备份 / 数据库 / 部署脚本 / 日志 / 证书私钥等敏感文件
# 即使被误投到站点根目录也不允许公开读取。Disallow 不等于不可索引，敏感内容
# 必须在服务端层面不公开；命中即 404，避免泄露备份文件名与服务器路径。
location ~* \.(bak|backup|old|orig|save|sql|sqlite3?|db|db3|zip|tar|tgz|gz|rar|7z|log|env|ini|conf|sh|py|yml|yaml|pem|key)$ {
    return 404;
}

# 智能客服 KB：SSE 流式接口
# 必须关缓冲 + HTTP/1.1 空连接头 + 关 gzip（与后端 X-Accel-Buffering: no 两个都要，
# 否则流式变一次性返回）。前缀最长匹配优先，/api/kb/* 全量命中本块。
location ^~ /api/kb/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 300s;
    # 知识库文档上传走本 location（^~ /api/kb/ 优先于 ^~ /api/），
    # 必须显式给体积上限；否则吃 nginx 默认 1m，2MB 文档直接 413。
    # 与 KB_UPLOAD_MAX_MB（默认 20）及 ^~ /api/ 保持一致。
    client_max_body_size 20m;
}

# 站内信实时推送 SSE（FLPR-32）：与 /api/kb/ 同套四件套，两份 nginx 配置必须同步。
# 精确匹配优先于下方 ^~ /api/ 的 15s 读超时；query 参数不参与 location 匹配。
location = /api/messages/stream {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 300s;
}

# API 反代到本机 FastAPI（后端所有接口统一挂 /api 前缀）。
# openresty 容器为 host 网络，故 127.0.0.1 = 宿主机；后端容器只绑回环 5000。
# ^~ 前缀匹配优先于上方静态资源正则，保证 /api/* 全量命中反代。
location ^~ /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    # 公告 / 论坛/文档上传接口的体积上限（OpenResty 默认 1M，过小）；与 web/nginx.conf 同步
    client_max_body_size 20m;
}

# 旧路径兼容（勿删）：
# /health — 外部监控/旧部署门禁仍在用（后端保留 /health 旧路由）
location = /health {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# /announcement/uploads/ — 历史公告正文内嵌的旧图片 URL（存量数据兼容）
location ^~ /announcement/uploads/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 资源中心下载跳转端点（不挂 /api：浏览器地址栏直达的 302 跳转 URL）。
# 前缀与前端页面路由不同名（页面是 /resources，这里是 /download），无冲突。
location ^~ /download/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# FLPR-72：知识库正文里的 /doc-image/xxx.png 指向持久化资源卷（与 web/nginx.conf 同步）。
# 用 ^~ 而非普通前缀：上方 `~* \.(png|...)$` 正则会优先于普通前缀 location。
# 宿主侧核对：compose 卷 ./backend/data/kb-assets 对应宿主机实际路径（如 /opt/xqly-website/backend/data/kb-assets）。
location ^~ /doc-image/ {
    alias /app/data/kb-assets/doc-image/;
    expires 7d;
    add_header Cache-Control "public";
}

# /admin 与 /wiki 目录跳转（相对 Location，浏览器自行保留协议与端口）
location = /admin {
    return 301 /admin/;
}
# FLPR-66：后台路径显式 noindex——robots.txt 的 Disallow 只是请求而非保证，
# 若后台 URL 已被外链引用仍可能被索引。普通前缀匹配，静态资源仍走上方正则缓存规则。
location /admin/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/index.html /admin/index.html =404;
}
location = /wiki {
    return 301 /wiki/;
}

# Wiki cleanUrls：无后缀 clean 链接先命中 xxx.html，再目录；未命中回落 VitePress 404 页
location /wiki/ {
    try_files $uri $uri.html $uri/ =404;
    error_page 404 /wiki/404.html;
}

# 预渲染产物（FLPR-63）：真实 .html / 目录 index.html 优先命中；命中不了走真 404。
# server 块已有 `error_page 404 /404.html;`（frontend/public/404.html 随产物部署），
# 不要再改成 `try_files $uri $uri/ /index.html`：那会让任意路径返回 200 + 首页空壳。
location / {
    try_files $uri $uri.html $uri/index.html @not_found;
}

# 仍留在客户端渲染的动态路由：登录 / 注册（不预渲染、不进 sitemap），
# 以及按用户或接口取数的详情路由（/staff/:code、/forum/*、/resources/*）。
location ~ ^/(login|register|staff|forum|resources)(/|$) {
    try_files $uri $uri.html $uri/index.html /index.html;
}

location @not_found {
    return 404;
}
