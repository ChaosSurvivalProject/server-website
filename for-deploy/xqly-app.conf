# 星穹旅驿官网 · 应用相关 location（生产实际生效）
#
# 位置：服务器 /opt/1panel/www/sites/xqly.xt91tv.shop/proxy/xqly-app.conf
# 由 1panel 静态网站模板生成的 server 块内的
#   include /www/sites/xqly.xt91tv.shop/proxy/*.conf;
# 引入（该 include 行需手工加进 /opt/1panel/www/conf.d/xqly.xt91tv.shop.conf，
# 1panel 的静态网站模板不生成它，也不会生成 SPA 的 try_files 兜底）。
#
# ⚠️ 在 1panel 面板里改动该站点的「网站设置」（域名/证书/端口等）会重新生成
#    conf.d/xqly.xt91tv.shop.conf，include 行会丢失——站点会立刻变成
#    「深层路由 404 + /api 不通」。改完站点设置后必须回来核对这一行。
#
# 仓库内留档：for-deploy/xqly-app.conf（与线上字节一致）。

# 静态资源缓存（含 Minecraft 字体 otf/ttf）；正则 location 优先于 location /，
# 但低于 ^~ /api/ —— 不会截走接口请求
location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?|otf|ttf)$ {
    expires 7d;
    add_header Cache-Control "public";
}

# 智能客服 KB：SSE 流式接口
# 必须关缓冲 + HTTP/1.1 空连接头 + 关 gzip（与后端 X-Accel-Buffering: no 两个都要，
# 否则流式变一次性返回）。前缀最长匹配优先，/api/kb/* 全量命中本块。
location ^~ /api/kb/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 300s;
}

# API 反代到本机 FastAPI（后端所有接口统一挂 /api 前缀）。
# openresty 容器为 host 网络，故 127.0.0.1 = 宿主机；后端容器只绑回环 5000。
# ^~ 前缀匹配优先于上方静态资源正则，保证 /api/* 全量命中反代。
location ^~ /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
}

# 旧路径兼容（勿删）：
# /health — 外部监控/旧部署门禁仍在用（后端保留 /health 旧路由）
location = /health {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# /announcement/uploads/ — 历史公告正文内嵌的旧图片 URL（存量数据兼容）
location ^~ /announcement/uploads/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /admin 与 /wiki 目录跳转（相对 Location，浏览器自行保留协议与端口）
location = /admin {
    return 301 /admin/;
}
location = /wiki {
    return 301 /wiki/;
}

# Wiki cleanUrls：无后缀 clean 链接先命中 xxx.html，再目录；未命中回落 VitePress 404 页
location /wiki/ {
    try_files $uri $uri.html $uri/ =404;
    error_page 404 /wiki/404.html;
}

# SPA 兜底：history 路由（/announcements/... /staff/{code} /team /forum/...）刷新时
# 回落 index.html。1panel 静态网站模板不生成该行，缺了深层路由与扫码直达全部 404。
location / {
    try_files $uri $uri/ /index.html;
}
