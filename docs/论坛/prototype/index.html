<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星穹旅驿社区 · 第一阶段原型（MVP）</title>
<style>
:root{
  --bg:#eef2f7; --bg-soft:#f7f9fc; --card:#fff; --line:#e3e8ef; --line-soft:#eef1f6;
  --text:#1f2937; --text-2:#5b6676; --text-3:#93a0b1;
  --brand:#3b82f6; --brand-d:#2563eb; --brand-soft:#eff5ff;
  --warn:#f59e0b; --warn-soft:#fff7e6;
  --danger:#ef4444; --danger-soft:#feecec;
  --ok:#22c55e; --ok-soft:#eafaf0;
  --purple:#8b5cf6; --purple-soft:#f3efff;
  --radius:12px; --radius-s:8px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05);
  --shadow-l:0 8px 28px rgba(16,24,40,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--brand);text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none}

/* ══ 原型工具条（非产品功能） ══ */
#proto-bar{
  background:#111827;color:#cbd5e1;font-size:12px;padding:7px 16px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:90;
}
#proto-bar .pb-title{font-weight:600;color:#fff}
#proto-bar .pb-dim{color:#64748b}
#proto-bar .pb-group{display:flex;align-items:center;gap:6px}
#proto-bar .pb-sep{width:1px;height:16px;background:#334155}
#proto-bar button{
  background:#1f2937;color:#cbd5e1;border:1px solid #334155;border-radius:6px;
  padding:3px 10px;font-size:12px;transition:.15s;
}
#proto-bar button:hover{background:#334155;color:#fff}
#proto-bar button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
#proto-bar .pb-hint{margin-left:auto;color:#64748b}

/* ══ 站点导航 ══ */
#site-nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:33px;z-index:80}
#site-nav .nav-in{max-width:1200px;margin:0 auto;padding:0 20px;height:58px;display:flex;align-items:center;gap:26px}
.logo{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;letter-spacing:.5px;color:var(--text)}
.logo-mark{
  width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#60a5fa,#3b82f6 55%,#8b5cf6);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800;
}
.nav-links{display:flex;gap:4px;flex:1}
.nav-links a{padding:6px 13px;border-radius:8px;color:var(--text-2);font-weight:500;transition:.15s}
.nav-links a:hover{background:var(--bg-soft);color:var(--text)}
.nav-links a.active{background:var(--brand-soft);color:var(--brand-d)}
.nav-right{display:flex;align-items:center;gap:12px}
.icon-btn{
  width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);position:relative;transition:.15s;
}
.icon-btn:hover{background:var(--bg-soft);color:var(--brand)}
.nav-user{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:20px;transition:.15s}
.nav-user:hover{background:var(--bg-soft)}
.nav-user .nm{font-weight:600;font-size:13px}
.avatar{
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;flex:0 0 auto;background:linear-gradient(135deg,#93b4fd,#3b82f6);
}
.av-28{width:28px;height:28px;font-size:12px}
.av-32{width:32px;height:32px;font-size:13px}
.av-40{width:40px;height:40px;font-size:15px}
.av-56{width:56px;height:56px;font-size:21px}
.av-admin{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.av-gray{background:linear-gradient(135deg,#cbd5e1,#94a3b8)}

/* ══ 通用 ══ */
.wrap{max-width:1200px;margin:0 auto;padding:20px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 16px;border-radius:9px;font-weight:600;font-size:13.5px;
  border:1px solid var(--line);background:#fff;color:var(--text-2);transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:#c7d2e0;color:var(--text)}
.btn-pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-pri:hover{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-ok:hover{filter:brightness(.94);color:#fff}
.btn-warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn-warn:hover{filter:brightness(.94);color:#fff}
.btn-danger{background:#fff;border-color:#f7c6c6;color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn-sm{padding:4px 11px;font-size:12.5px;border-radius:7px}
.btn-lg{padding:11px 26px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{border-color:transparent;background:transparent;color:var(--text-3)}
.btn-ghost:hover{background:var(--bg-soft);color:var(--text-2);border-color:transparent}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.card-hd{padding:14px 18px;border-bottom:1px solid var(--line-soft);font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:space-between}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.muted{color:var(--text-3)}
.muted2{color:var(--text-2)}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;align-items:center;justify-content:space-between}
.sep{height:1px;background:var(--line-soft);margin:14px 0}
.hidden-input{position:absolute;opacity:0;pointer-events:none}

/* 徽章 / 标签 */
.tag{
  display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:6px;
  font-size:11.5px;font-weight:600;line-height:1.7;white-space:nowrap;
}
.tag-top{background:#fee2e2;color:#b91c1c}
.tag-featured{background:#fef3c7;color:#b45309}
.tag-cat{background:#eef2f7;color:var(--text-2)}
.tag-hash{background:var(--bg-soft);color:var(--text-2);border:1px solid var(--line);font-weight:500}
.badge{display:inline-flex;align-items:center;padding:1px 8px;border-radius:5px;font-size:11px;font-weight:700}
.b-wait{background:var(--warn-soft);color:#b45309}
.b-pub{background:var(--ok-soft);color:#15803d}
.b-rej{background:var(--danger-soft);color:#b91c1c}
.b-off{background:#eef2f7;color:#64748b}
.b-role{background:var(--purple-soft);color:#6d28d9}

/* ══ 首页 ══ */
.forum-grid{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:20px;align-items:start}
.banner{
  border-radius:var(--radius);overflow:hidden;position:relative;
  background:linear-gradient(115deg,#1e3a8a 0%,#2563eb 42%,#4f46e5 100%);
  min-height:196px;display:flex;box-shadow:var(--shadow);color:#fff;
}
.banner-l{flex:1;padding:30px 28px 62px;position:relative;z-index:2;min-width:0}
.banner-l h1{font-size:27px;font-weight:800;letter-spacing:.5px;margin-bottom:9px}
.banner-l h1 span{color:#bfdbfe;font-weight:600;font-size:19px}
.banner-l p{color:#c7d8f7;font-size:13.5px;max-width:440px;line-height:1.75}
.banner-r{width:300px;flex:0 0 auto;position:relative;z-index:1}
.banner-art{position:absolute;right:0;bottom:0;width:300px;height:196px;display:block}
.banner-art.none{display:flex;align-items:center;justify-content:center;width:100%;color:#93b4fd;font-size:12px;border:1px dashed #3b5fc4;margin:24px;border-radius:10px;width:auto;height:auto;right:24px;bottom:26px;padding:14px 20px}
.banner-bar{
  position:absolute;left:0;right:0;bottom:0;padding:10px 16px;z-index:3;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(to top,rgba(15,23,42,.5),rgba(15,23,42,0));
}
.banner-bar select,.banner-bar input{
  height:34px;border-radius:8px;border:none;background:rgba(255,255,255,.94);
  padding:0 12px;font-size:13px;color:var(--text);
}
.banner-bar select{padding-right:6px;font-weight:500}
.banner-bar input{flex:1;max-width:260px}
.banner-bar input::placeholder{color:var(--text-3)}
.banner-bar .btn{height:34px;padding:0 16px}

.cat-tabs{display:flex;gap:8px;margin:16px 0 14px;overflow-x:auto;padding-bottom:2px}
.cat-tab{
  display:inline-flex;align-items:center;gap:7px;padding:7px 15px;border-radius:999px;
  background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--text-2);
  white-space:nowrap;transition:.15s;
}
.cat-tab:hover{border-color:#c7d2e0}
.cat-tab.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.cat-tab.on .dot{background:#fff !important;opacity:.9}

.post-list{display:flex;flex-direction:column;gap:12px}
.post-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
  display:flex;gap:16px;box-shadow:var(--shadow);transition:.15s;cursor:pointer;
}
.post-card:hover{border-color:#c7d2e0;box-shadow:0 4px 18px rgba(16,24,40,.09);transform:translateY(-1px)}
.post-main{flex:1;min-width:0}
.post-tags{display:flex;gap:6px;margin-bottom:7px;flex-wrap:wrap}
.post-title{font-size:16.5px;font-weight:700;color:var(--text);margin-bottom:6px;line-height:1.45}
.post-card:hover .post-title{color:var(--brand-d)}
.post-sum{
  color:var(--text-3);font-size:13px;line-height:1.65;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.post-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;gap:12px;flex-wrap:wrap}
.post-author{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)}
.post-author .nm{font-weight:600;color:var(--text-2)}
.post-stats{display:flex;gap:16px;font-size:12.5px;color:var(--text-3);align-items:center}
.post-stats .st{display:inline-flex;align-items:center;gap:5px}
.thumb{
  width:98px;height:98px;border-radius:10px;flex:0 0 auto;overflow:hidden;
  border:1px solid var(--line);background:var(--bg-soft);
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated}
.thumb-empty{display:flex;align-items:center;justify-content:center;height:100%;color:#c3ccd8;font-size:11px}

.empty{
  border:1.5px dashed #d3dbe6;border-radius:var(--radius);padding:46px 20px;text-align:center;
  color:var(--text-3);background:rgba(255,255,255,.6);
}
.empty .em-t{font-size:15px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:18px}
.pager button{
  min-width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;
  color:var(--text-2);font-size:13px;font-weight:600;
}
.pager button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pager button:disabled{opacity:.45}

/* 侧边栏 */
.side-col{display:flex;flex-direction:column;gap:16px;position:sticky;top:105px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stat3 .s-v{font-size:20px;font-weight:800;color:var(--text)}
.stat3 .s-l{font-size:11.5px;color:var(--text-3);margin-top:2px}
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px}
.tag-cloud .tag-hash{cursor:pointer;transition:.15s}
.tag-cloud .tag-hash:hover{border-color:var(--brand);color:var(--brand-d)}
.tag-cloud .tag-hash.on{background:var(--brand-soft);border-color:#bfdbfe;color:var(--brand-d);font-weight:600}

/* ══ 详情页 ══ */
.focus-wrap{max-width:1080px;margin:0 auto;padding:20px}
.back-link{
  display:inline-flex;align-items:center;gap:7px;color:var(--text-2);font-weight:600;
  font-size:14px;margin-bottom:16px;padding:6px 12px;border-radius:8px;transition:.15s;
}
.back-link:hover{background:#fff;color:var(--brand-d)}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.art-title{font-size:24px;font-weight:800;line-height:1.42;margin:10px 0 14px}
.art-meta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:1px solid var(--line-soft)}
.art-meta-r{display:flex;gap:20px}
.art-meta-r .m{text-align:center}
.art-meta-r .m b{display:block;font-size:17px;font-weight:800}
.art-meta-r .m span{font-size:11.5px;color:var(--text-3)}

.md{font-size:15px;line-height:1.85;color:#2b3648;word-break:break-word}
.md h1,.md h2,.md h3{margin:22px 0 10px;font-weight:800;line-height:1.4}
.md h1{font-size:21px}.md h2{font-size:18px}.md h3{font-size:16px}
.md p{margin:13px 0}
.md ul{margin:13px 0 13px 22px}
.md li{margin:5px 0}
.md blockquote{
  margin:14px 0;padding:10px 16px;border-left:3px solid #bfdbfe;background:var(--brand-soft);
  border-radius:0 8px 8px 0;color:var(--text-2);font-size:14px;
}
.md code{background:#f1f5f9;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:13px;
  font-family:ui-monospace,Consolas,Monaco,monospace;color:#b91c1c}
.md img{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.md a{border-bottom:1px solid #bfdbfe}
.code-block{margin:14px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fbfcfe}
.code-bar{
  display:flex;align-items:center;justify-content:space-between;padding:6px 12px;
  background:#f1f5f9;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--text-3);
  font-family:ui-monospace,Consolas,monospace;
}
.code-bar button{font-size:11.5px;color:var(--text-2);padding:2px 8px;border-radius:5px}
.code-bar button:hover{background:#e2e8f0;color:var(--text)}
.code-block pre{padding:14px;overflow-x:auto}
.code-block code{background:none;border:none;padding:0;color:#334155;font-size:12.8px;line-height:1.65}

.act-bar{display:flex;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line-soft)}
.act{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:46px;
  border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--text-2);font-weight:600;transition:.15s;
}
.act:hover{border-color:#c7d2e0;background:var(--bg-soft)}
.act.on{border-color:#fca5a5;background:#fff5f5;color:#dc2626}
.act.on-fav{border-color:#fcd34d;background:#fffbeb;color:#b45309}

.cmt-input{display:flex;gap:12px;margin:16px 0}
.cmt-input textarea{
  flex:1;min-height:82px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  resize:vertical;line-height:1.7;font-size:14px;background:#fbfcfe;
}
.cmt-input textarea:focus{border-color:#bfdbfe;background:#fff}
.cmt-hint{font-size:12px;color:var(--text-3);margin-top:7px}
.cmt-list{display:flex;flex-direction:column;gap:2px}
.cmt{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid var(--line-soft)}
.cmt:last-child{border-bottom:none}
.cmt-body{flex:1;min-width:0}
.cmt-head{display:flex;align-items:center;gap:8px;font-size:12.8px;color:var(--text-3);margin-bottom:5px}
.cmt-head .nm{font-weight:600;color:var(--text-2);font-size:13px}
.cmt-text{color:#334155;font-size:14px;white-space:pre-wrap;word-break:break-word}
/* 评论：两级楼中楼 + 点赞 + 内联回复框（PRD §5.4.3） */
.cmt-acts{display:flex;align-items:center;gap:14px;margin-top:7px}
.cmt-act{
  display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text-3);
  padding:2px 7px;border-radius:6px;transition:.14s;
}
.cmt-act:hover{background:var(--bg-soft);color:var(--text-2)}
.cmt-act.on{color:#dc2626;font-weight:600}
.reply-list{margin-top:6px;margin-left:6px;border-left:2px solid var(--line);padding-left:14px}
.cmt.reply{padding:12px 0}
.cmt.reply .cmt-text{font-size:13.5px}
.reply-to{color:var(--brand);font-size:12.5px;font-weight:600}
.cmt-form{
  display:flex;gap:10px;margin:12px 0 6px;padding:12px;background:#f7f9fc;
  border:1px solid var(--line);border-radius:10px;
}
.cmt-form.nested{margin-left:6px}
.cmt-form-tip{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:12.5px;color:var(--text-2);margin-bottom:7px;
}
.cmt-form textarea{
  width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;resize:vertical;line-height:1.7;font-size:13.5px;background:#fff;
}
.cmt-form textarea:focus{border-color:#bfdbfe}

.author-card-top{display:flex;flex-direction:column;align-items:center;padding:6px 0 2px;text-align:center}
.author-card-top .nm{font-weight:700;font-size:15.5px;margin-top:10px}
.author-card-acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.mini-post{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line-soft);font-size:13.2px}
.mini-post:last-child{border-bottom:none}
.mini-post .t{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-post:hover .t{color:var(--brand-d)}

.status-banner{
  border-radius:var(--radius);padding:13px 16px;margin-bottom:16px;font-size:13.5px;
  display:flex;align-items:center;gap:10px;font-weight:600;
}
.sb-wait{background:var(--warn-soft);color:#92400e;border:1px solid #fcd34d}
.sb-rej{background:var(--danger-soft);color:#991b1b;border:1px solid #fca5a5}
.sb-off{background:#eef2f7;color:#475569;border:1px solid #cbd5e1}

/* ══ 表单页 ══ */
.form-wrap{max-width:880px;margin:0 auto;padding:20px}
.field{margin-bottom:20px}
.field>label{display:block;font-weight:700;font-size:13.5px;margin-bottom:9px}
.field .req{color:var(--danger);margin-left:3px}
.field .tip{font-weight:400;color:var(--text-3);font-size:12px;margin-left:6px}
.inp{
  width:100%;height:42px;border:1px solid var(--line);border-radius:9px;padding:0 13px;
  background:#fbfcfe;font-size:14px;transition:.15s;
}
.inp:focus{border-color:#bfdbfe;background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.09)}
textarea.inp{height:auto;padding:11px 13px;line-height:1.75;resize:vertical;min-height:96px}
.cat-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.cat-pick .cp{
  display:flex;align-items:center;gap:8px;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:#fbfcfe;font-weight:500;font-size:13.5px;transition:.15s;
}
.cat-pick .cp:hover{border-color:#c7d2e0}
.cat-pick .cp.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-d);font-weight:700;
  box-shadow:0 0 0 3px rgba(59,130,246,.08)}
.cover-box{
  border:1.5px dashed #d3dbe6;border-radius:10px;padding:18px;text-align:center;background:#fbfcfe;transition:.15s;
}
.cover-box:hover{border-color:#bfdbfe;background:var(--brand-soft)}
.cover-prev{display:flex;align-items:center;gap:14px;text-align:left}
.cover-prev .thumb{width:74px;height:74px}
.tag-input-box{
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;background:#fbfcfe;min-height:44px;
}
.tag-input-box input{border:none;background:none;flex:1;min-width:110px;height:26px;font-size:13.5px}

/* 像素风封面（内联 SVG，不依赖任何外部资源） */
function pixCover(seed){
  let r = seed * 9301 + 49297, rects = '';
  const rnd = () => ((r = (r * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  const pal = [['#60a5fa','#3b82f6'],['#34d399','#10b981'],['#fbbf24','#f59e0b'],
               ['#a78bfa','#8b5cf6'],['#f472b6','#ec4899'],['#22d3ee','#06b6d4']][seed % 6];
  for(let y=0;y<10;y++) for(let x=0;x<10;x++){
    const v = rnd();
    if(v > .46) rects += `<rect x="${x*6.4}" y="${y*6.4}" width="6.4" height="6.4" fill="${v>.74?pal[0]:pal[1]}"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#e8eef7"/>${rects}</svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function coverSeed(code){
  const i = CATS.findIndex(c => c.code === code);
  return i < 0 ? 0 : i;
}
/* Banner 右侧像素插画（占位素材，PRD 标注"待提供"） */
function bannerArtSVG(){
  const S = 6, cells = [];
  const put = (x,y,w,h,c) => cells.push(`<rect x="${x*S}" y="${y*S}" width="${w*S}" height="${h*S}" fill="${c}"/>`);
  /* 天空由容器渐变承担，这里画地面 + 城堡 + 树 + 人物 */
  put(0,20,50,4,'#1e40af'); put(0,22,50,4,'#1d4ed8');
  /* 城堡主体 */
  put(24,9,10,11,'#64748b'); put(24,7,3,3,'#94a3b8'); put(31,7,3,3,'#94a3b8');
  put(27,4,4,4,'#94a3b8'); put(28,3,2,1,'#cbd5e1');
  put(21,13,4,8,'#475569'); put(33,13,4,8,'#475569');
  put(28,14,2,3,'#facc15');  /* 门 */
  /* 树 */
  put(8,15,2,6,'#78350f'); put(5,12,5,4,'#15803d'); put(41,14,2,7,'#78350f'); put(38,11,5,4,'#16a34a');
  /* 人物（史蒂夫配色） */
  put(15,17,2,2,'#4b5563'); put(15,19,2,3,'#0ea5e9'); put(15,22,1,2,'#1e3a8a'); put(16,22,1,2,'#1e3a8a');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${50*S} ${26*S}" preserveAspectRatio="none">${cells.join('')}</svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function relTime(iso){
  if(!iso) return '';
  const d = new Date(iso.replace(' ','T')), now = new Date('2026-09-27T19:00:00');
  const m = Math.floor((now - d) / 60000);
  if(m < 1) return '刚刚';
  if(m < 60) return m + ' 分钟前';
  if(m < 60*24) return Math.floor(m/60) + ' 小时前';
  if(m < 60*24*7) return Math.floor(m/60/24) + ' 天前';
  return iso.slice(5,10).replace('-','-');
}
function shortTime(iso){ return iso ? iso.slice(5,10) : '—'; }

/* 极简但安全的 Markdown 渲染（先转义再替换，禁止 raw HTML） */
function renderMD(src){
  let s = esc(src || '');
  const blocks = [];
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push({lang:lang || 'text', code:code.replace(/\n$/,'')});
    return '\u0000B' + (blocks.length - 1) + '\u0000';
  });
  s = s.replace(/^### (.*)$/gm, '<h3>$1</h3>')
       .replace(/^## (.*)$/gm,  '<h2>$1</h2>')
       .replace(/^# (.*)$/gm,   '<h1>$1</h1>');
  s = s.replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>');
  s = s.replace(/(?:^- .*(?:\n|$))+/gm, m =>
        '<ul>' + m.trim().split('\n').map(l => '<li>' + l.replace(/^- /,'') + '</li>').join('') + '</ul>');
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2">')
       .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
       .replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.split(/\n{2,}/).map(p =>
        /^\s*(<(h\d|ul|ol|blockquote|img|div|pre)|\u0000B)/.test(p) ? p
        : '<p>' + p.replace(/\n/g,'<br>') + '</p>').join('');
  s = s.replace(/\u0000B(\d+)\u0000/g, (m, i) =>
        '<div class="code-block"><div class="code-bar"><span>' + blocks[i].lang + '</span>' +
        '<button onclick="toast(\'代码已复制（原型演示）\',\'ok\')">复制</button></div>' +
        '<pre><code>' + blocks[i].code + '</code></pre></div>');
  return s;
}
function plainSummary(a){
  if(a.summary) return a.summary;
  return (a.content || '').replace(/[#>*`\-!\[\]()]/g,'').replace(/\s+/g,' ').trim().slice(0,100);
}
function statusMeta(a){
  if(a.status === 1) return {label:'已发布', cls:'b-pub'};
  if(a.status === 0) return {label:'待审核', cls:'b-wait'};
  if(a.status === 2) return {label:'已驳回', cls:'b-rej'};
  return {label:'已下架', cls:'b-off'};
}
let toastTimer = null;
function toast(msg, type){
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' t-' + type : '');
  el.style.opacity = 1; el.style.transform = 'translate(-50%,0)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; el.style.opacity = 0; }, 2300);
}
function requireLogin(what){

function listArticles(){
  let arr = ARTICLES.filter(a => a.status === 1);
  const c = state.category;
  if(c === 'recommend')      arr = arr.filter(a => a.isTop || a.isFeatured);
  else if(c !== 'home')      arr = arr.filter(a => a.cat === c);
  if(state.tag)              arr = arr.filter(a => (a.tags||[]).includes(state.tag));
  if(state.q){
    const q = state.q.toLowerCase();
    arr = arr.filter(a => (a.title + ' ' + plainSummary(a)).toLowerCase().includes(q));
  }
  arr.sort((x,y) => {
    if(x.isTop !== y.isTop) return y.isTop - x.isTop;           /* 置顶恒在最前 */
    if(state.sort === 'views')    return y.viewCount - x.viewCount;
    if(state.sort === 'comments') return y.commentCount - x.commentCount;
    return (y.publishTime || y.createTime).localeCompare(x.publishTime || x.createTime);
  });
  return arr;
}

      <div class="post-list">${pageList.length ? pageList.map(postCardHTML).join('') : emptyListHTML()}</div>

    <div class="em-t">这里还没有帖子</div>
    <div>换个板块看看，或者发布第一篇。</div>
    <div style="margin-top:16px"><button class="btn btn-pri" onclick="startCreate()">发布第一篇</button></div>
  </div>`;
}
function pagerHTML(totalPages, total){
  if(total === 0) return '';
  let btns = '';
  for(let i=1;i<=totalPages;i++){
    if(totalPages > 7 && i > 3 && i < totalPages - 1 && Math.abs(i - state.page) > 1) {
      if(i === 4) btns += '<span class="muted" style="padding:0 4px">…</span>';
      continue;
    }
    btns += `<button class="${i===state.page?'on':''}" onclick="setPage(${i})">${i}</button>`;
  }
  return `<div class="pager">
    <button ${state.page<=1?'disabled':''} onclick="setPage(${state.page-1})">‹</button>
    ${btns}
    <button ${state.page>=totalPages?'disabled':''} onclick="setPage(${state.page+1})">›</button>
    <span class="muted" style="margin-left:8px">共 ${total} 篇</span>
  </div>`;
}

function userCardHTML(){

    return `<div class="card card-pad" style="text-align:center">
      <div class="muted" style="font-size:13px;margin-bottom:12px">登录后可以发帖、评论、点赞</div>
      <div style="display:grid;gap:9px">
        <button class="btn btn-pri" onclick="toast('跳转登录页（原型未展开）')">登录</button>
        <button class="btn" onclick="toast('跳转注册页（原型未展开）')">注册新账号</button>
      </div>
    </div>`;

  return `
  <div class="card card-pad">
    <div style="display:flex;align-items:center;gap:12px">
      ${avatarHTML(u,40)}

          ${esc(u.name)}${u.role==='admin'?'<span class="badge b-role">管理员</span>':''}

        <div class="muted" style="font-size:12px">发帖 ${mine.length} · 获赞 ${myLikes}</div>
      </div>

function statsCardHTML(){
  const published = ARTICLES.filter(a => a.status === 1);
  const totalView = published.reduce((s,a) => s + a.viewCount, 0);
  const usedTags = new Set();
  published.forEach(a => (a.tags||[]).forEach(t => usedTags.add(t)));
  return `
  <div class="card">
    <div class="card-hd" style="border-bottom:none;padding-bottom:4px">社区统计</div>
    <div class="card-pad" style="padding-top:8px">
      <div class="stat3">
        <div><div class="s-v">${published.length}</div><div class="s-l">文章数</div></div>
        <div><div class="s-v">${totalView.toLocaleString()}</div><div class="s-l">浏览数</div></div>
        <div><div class="s-v">${usedTags.size}</div><div class="s-l">标签数</div></div>
      </div>
    </div>
  </div>`;
}

function hotTagsHTML(){
  const arr = TAGS.slice().sort((a,b) => (b.isHot - a.isHot) || (b.useCount - a.useCount)).slice(0,10);
  return `
  <div class="card">
    <div class="card-hd" style="border-bottom:none;padding-bottom:4px">热门标签</div>
    <div class="card-pad" style="padding-top:8px">
      <div class="tag-cloud">
        ${arr.map(t => `<span class="tag tag-hash ${state.tag===t.name?'on':''}" onclick="setTag('${esc(t.name)}')">
          # ${esc(t.name)} <b style="font-weight:600;opacity:.72">${t.useCount}</b></span>`).join('')}
      </div>
    </div>
  </div>`;
}

/* 图标 */
function icon(n){
  const s = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
  if(n === 'eye')  return s + '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
  if(n === 'heart')return s + '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>';
  if(n === 'cmt')  return s + '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>';
  if(n === 'star') return s + '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>';
  if(n === 'share')return s + '<circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>';
  if(n === 'edit') return s + '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>';
  return '';
}

function renderPost(){
  const a = getArticle(state.articleId);
  if(!a) return notFoundHTML('帖子不存在或已被删除');
  const isAuthor = isLogged() && me().id === a.authorId;
  /* 非公开状态：仅作者与管理员可见，其余按 404（PRD §5.4.2） */
  if(a.status !== 1 && !isAuthor && !isAdmin()) return notFoundHTML('帖子不存在或已被删除');

  let banner = '';
  if(a.status === 0 && (isAuthor || isAdmin()))
    banner = `<div class="status-banner sb-wait">该帖正在审核中，仅你与管理员可见。</div>`;
  if(a.status === 2 && (isAuthor || isAdmin()))
    banner = `<div class="status-banner sb-rej">该帖未通过审核：${esc(a.reviewNote || '（未填写理由）')}</div>`;
  if(a.status === 3 && (isAuthor || isAdmin()))
    banner = `<div class="status-banner sb-off">该帖已下架${a.removeBy === 'admin' ? '（管理员下架）' : '（作者删除）'}${a.reviewNote ? '：' + esc(a.reviewNote) : ''}</div>`;

  const liked = LIKES.has(state.user + ':' + a.id);
  const faved = FAVS.has(state.user + ':' + a.id);
  const c = catOf(a.cat);
  const author = userOf(a.authorId);
  /* 顶层评论按时间倒序（最新在前）；同一顶层下的回复按时间正序（PRD §4.4） */
  const tops = COMMENTS.filter(x => x.articleId === a.id && x.status === 1 && !x.parentId)
                       .sort((x,y) => y.createTime.localeCompare(x.createTime));

  return `
  <div class="focus-wrap">
    <a class="back-link" href="javascript:go('home')">← 返回社区</a>
    ${banner}
    <div class="detail-grid">
      <div>
        <!-- 帖子详情卡片 -->
        <div class="card" style="padding:22px">
          <span class="tag tag-cat"><span class="dot" style="background:${c.color};margin-right:5px"></span>${esc(c.name)}</span>
          <h1 class="art-title">${esc(a.title)}</h1>
          <div class="art-meta">
            <div class="row" style="gap:10px">
              ${avatarHTML(author,40)}
              <div>
                <div style="font-weight:700;display:flex;align-items:center;gap:7px">${esc(author.name)}${badgeHTML(a.authorId)}</div>
                <div class="muted" style="font-size:12.5px">发布于 ${shortTime(a.publishTime || a.createTime)}${a.resubmitCount ? ' · 第 ' + (a.resubmitCount+1) + ' 次提交' : ''}</div>
              </div>
              ${(isAuthor && canEditArticle(a)) ? `<button class="btn btn-sm" style="margin-left:12px" onclick="go('edit',${a.id})">${icon('edit')} 编辑</button>` : ''}
            </div>
            <div class="art-meta-r">
              <div class="m"><b>${a.viewCount}</b><span>浏览</span></div>
              <div class="m"><b>${a.likeCount}</b><span>点赞</span></div>
              <div class="m"><b>${a.commentCount}</b><span>评论</span></div>
            </div>
          </div>
          <div class="md" style="margin-top:20px">${renderMD(a.content)}</div>
          <div class="act-bar">
            <button class="act ${liked?'on':''}" onclick="toggleLike(${a.id})">${icon('heart')} ${liked?'已赞':'赞'} ${a.likeCount}</button>
            <button class="act ${faved?'on-fav':''}" onclick="toggleFav(${a.id})">${faved?'★ 已收藏':'☆ 收藏'}</button>
            <button class="act" onclick="share(${a.id})">${icon('share')} 分享</button>
          </div>
        </div>

        <!-- 评论区卡片 -->
        <div class="card" style="padding:22px;margin-top:18px">
          <div style="font-weight:800;font-size:16px">评论 ${a.commentCount}</div>
          <div class="muted" style="font-size:12.5px;margin-bottom:2px">
            顶层评论 ${tops.length} 条 · 含回复共 ${a.commentCount} 条
          </div>
          <div class="cmt-input">
            ${avatarHTML(isLogged() ? me() : USERS.anon, 32)}
            <div style="flex:1">
              <textarea id="cmt-box" placeholder="${isLogged() ? '友善地发表你的看法...' : '登录后参与讨论'}"
                ${isLogged() ? '' : 'disabled style="background:#f1f5f9;cursor:not-allowed"'}></textarea>
              <div class="spread" style="margin-top:8px">
                <span class="cmt-hint">理性发言，文明交流</span>
                <button class="btn btn-pri btn-sm" onclick="submitComment(${a.id})">发表评论</button>
              </div>
            </div>
          </div>
          ${tops.length
            ? `<div class="cmt-list">${tops.map(t => cmtTopHTML(t, a.id)).join('')}</div>`
            : `<div class="empty" style="padding:32px 20px;margin-top:10px">还没有评论，来抢沙发吧~</div>`}
        </div>
      </div>

      <!-- 侧边栏 -->
      <aside class="side-col">
        <div class="card">
          <div class="card-hd">作者</div>
          <div class="card-pad">
            <div class="author-card-top">
              ${avatarHTML(author,56)}
              <div class="nm">${esc(author.name)}</div>
              <div style="margin-top:5px">${badgeHTML(a.authorId) || '<span class="muted" style="font-size:12px">普通用户</span>'}</div>
            </div>
            <div class="sep"></div>
            <div class="stat3">
              <div><div class="s-v">${ARTICLES.filter(x => x.authorId===a.authorId && x.status===1).length}</div><div class="s-l">发帖</div></div>
              <div><div class="s-v">${ARTICLES.filter(x => x.authorId===a.authorId).reduce((s,x)=>s+x.likeCount,0)}</div><div class="s-l">获赞</div></div>
              <div><div class="s-v">0</div><div class="s-l">粉丝</div></div>
            </div>
            <div class="author-card-acts">
              <button class="btn btn-pri btn-sm" onclick="toast('关注功能后续开发（第二阶段）','warn')">+ 关注</button>
              <button class="btn btn-ok btn-sm" onclick="toast('打赏功能后续开发（第二阶段）','warn')">打赏作者</button>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-hd">作者其他帖子</div>
          <div class="card-pad" style="padding-top:6px">
            ${authorOtherHTML(a)}
          </div>
        </div>
      </aside>
    </div>
  </div>`;
}
function authorOtherHTML(a){
  const arr = ARTICLES.filter(x => x.authorId === a.authorId && x.status === 1 && x.id !== a.id).slice(0,5);
  if(!arr.length) return `<div class="muted" style="font-size:13px;padding:10px 0">暂无其他帖子</div>`;
  return arr.map(x => `<div class="mini-post" onclick="go('post',${x.id})" style="cursor:pointer">
    <span class="t">${esc(x.title)}</span>
    <span class="muted" style="flex:0 0 auto">${x.viewCount}</span>
  </div>`).join('');
}
/* ── 评论区渲染（两级楼中楼，PRD §5.4.3 / §8-D15） ── */

/* 某条顶层评论下的回复（时间正序） */
function repliesOf(parentId){
  return COMMENTS.filter(x => x.parentId === parentId && x.status === 1)
                 .sort((x,y) => x.createTime.localeCompare(y.createTime));
}
/* 评论操作行：赞 + 回复 */
function cmtActsHTML(c){
  const liked = COMMENT_LIKES.has(state.user + ':' + c.id);
  return `<div class="cmt-acts">
    <button class="cmt-act ${liked ? 'on' : ''}" onclick="toggleCommentLike(${c.id})">
      ${icon('heart')} ${liked ? '已赞' : '赞'} ${c.likeCount}
    </button>
    <button class="cmt-act" onclick="openReply(${c.id})">回复</button>
  </div>`;
}
/* 内联回复框：同时只允许展开一个（PRD §5.4.3） */
function cmtFormHTML(parentId, replyToUserId, replyToName, targetText, nested){
  const excerpt = targetText.length > 26 ? targetText.slice(0, 26) + '…' : targetText;
  return `<div class="cmt-form${nested ? ' nested' : ''}">
    ${avatarHTML(me(), 28)}
    <div style="flex:1;min-width:0">
      <div class="cmt-form-tip">
        <span>回复 <b>@${esc(replyToName)}</b> <span class="muted">· ${esc(excerpt)}</span></span>
        <button class="link-op" onclick="cancelReply()">取消</button>
      </div>
      <textarea id="reply-box" placeholder="回复 @${esc(replyToName)}…"></textarea>
      <div class="spread" style="margin-top:8px">
        <span class="cmt-hint">理性发言，文明交流</span>
        <button class="btn btn-pri btn-sm" onclick="submitReply(${parentId}, ${replyToUserId})">发表回复</button>
      </div>
    </div>
  </div>`;
}
function cmtTopHTML(c, articleId){
  const u = userOf(c.authorId);
  const reps = repliesOf(c.id);
  const box = (state.replyTo && state.replyTo.afterId === c.id)
    ? cmtFormHTML(c.id, c.authorId, u.name, c.content, false) : '';
  return `<div class="cmt">
    ${avatarHTML(u, 32)}
    <div class="cmt-body">
      <div class="cmt-head">
        <span class="nm">${esc(u.name)}</span>${badgeHTML(c.authorId)}
        <span>· ${relTime(c.createTime)}</span>
      </div>
      <div class="cmt-text">${esc(c.content)}</div>
      ${cmtActsHTML(c)}
      ${box}
      ${reps.length ? `<div class="reply-list">${reps.map(r => cmtReplyHTML(r, c, articleId)).join('')}</div>` : ''}
    </div>
  </div>`;
}
function cmtReplyHTML(r, top, articleId){
  const u = userOf(r.authorId);
  /* 只有在"回复某条回复"时才显示 @；直接回复楼主不显示（PRD §5.4.3） */
  const at = (r.replyToUserId && r.replyToUserId !== top.authorId)
    ? `<span class="reply-to">回复 @${esc(userOf(r.replyToUserId).name)}</span> ` : '';
  const box = (state.replyTo && state.replyTo.afterId === r.id)
    ? cmtFormHTML(top.id, r.authorId, u.name, r.content, true) : '';
  return `<div class="cmt reply">
    ${avatarHTML(u, 28)}
    <div class="cmt-body">
      <div class="cmt-head">
        <span class="nm">${esc(u.name)}</span>${badgeHTML(r.authorId)}
        <span>· ${relTime(r.createTime)}</span>
      </div>
      <div class="cmt-text">${at}${esc(r.content)}</div>
      ${cmtActsHTML(r)}
      ${box}
    </div>
  </div>`;
}
function notFoundHTML(msg){
  return `<div class="focus-wrap">
    <a class="back-link" href="javascript:go('home')">← 返回社区</a>
    <div class="empty"><div class="em-t">${esc(msg)}</div>
      <div>该内容可能已被删除，或者你没有查看权限。</div>
      <div style="margin-top:16px"><button class="btn" onclick="go('home')">回到社区首页</button></div>
    </div></div>`;
}

/* ════════════════════════════════════════════════════════════════
   7. 发布 / 编辑文章页
   ════════════════════════════════════════════════════════════════ */

/* 准入范围：0/1/2 任意；3 仅 remove_by='author'（PRD §4.3） */
function canEditArticle(a){
  if(!a) return false;
  if(a.status === 3) return a.removeBy === 'author';
  return a.status === 0 || a.status === 1 || a.status === 2;
}

function startCreate(){
  if(!requireLogin('发布文章')) return;
  state.draft = {cat:'', title:'', cover:'', content:'', tags:[]};
  go('create');
}

function catPickHTML(cur){
  return `<div class="cat-pick">` + CATS.filter(c => !c.isSystem).map(c => `
    <button class="cp ${cur===c.code?'on':''}" onclick="pickCat('${c.code}')">
      <span class="dot" style="background:${c.color}"></span>${esc(c.name)}
    </button>`).join('') + `</div>`;
}
function tagEditorHTML(tags){
  return `
  <div class="tag-input-box">
    ${tags.map((t,i) => `<span class="tag-chip">${esc(t)}<button onclick="rmTag(${i})">×</button></span>`).join('')}
    ${tags.length >= 5
      ? '<span class="muted" style="font-size:12.5px">已达 5 个上限，删除一个可继续添加</span>'
      : `<input id="tag-inp" placeholder="输入标签后回车（最多 5 个）" maxlength="20"
                onkeydown="if(event.key==='Enter'){event.preventDefault();addTag(this.value);this.value=''}">`}
  </div>
  <div class="tag-sug">
    <span class="muted" style="font-size:12px;padding-top:3px">已有标签：</span>
    ${TAGS.slice(0,8).map(t => `<span class="tag tag-hash" style="cursor:pointer" onclick="addTag('${esc(t.name)}')"># ${esc(t.name)}</span>`).join('')}
  </div>`;
}
function mdEditorHTML(value, id){
  return `
  <div class="md-editor">
    <div class="md-tools">
      <button onclick="mdWrap('${id}','**','**')">粗体</button>
      <button onclick="mdWrap('${id}','*','*')">斜体</button>

      <div class="md-pv-t">预览效果</div>
      <div class="md" id="${id}-pv-body"></div>
    </div>

}

  const ok = d.cat && d.title.trim().length >= 2 && d.content.trim().length >= 10;
  return `
  <div class="form-wrap">
    <a class="back-link" href="javascript:go('home')">← 返回社区</a>

               <div class="thumb"><img src="${pixCover(coverSeed(d.cat||'home') + 3)}" alt=""></div>

               <button class="btn btn-sm btn-danger" onclick="state.draft.cover='';render()">移除</button>

function renderEdit(){
  if(!isLogged()) return notFoundHTML('请先登录');
  const a = getArticle(state.editId);
  /* 权限与准入：非作者一律 404；管理员下架的帖不允许作者编辑（400） */
  if(!a || (me().id !== a.authorId && !isAdmin())) return notFoundHTML('帖子不存在或已被删除');
  if(a.status === 3 && a.removeBy === 'admin'){
    return `<div class="form-wrap">
      <a class="back-link" href="javascript:go('my')">← 返回我的文章</a>
      <div class="card card-pad" style="border-color:#fca5a5">
        <div style="font-weight:800;font-size:16px;color:#b91c1c;margin-bottom:8px">该帖已被管理员下架</div>
        <div class="muted2" style="font-size:13.5px;margin-bottom:16px">
          后端返回 <code>400</code>：该帖已被管理员下架，请联系管理员处理。作者不能用"编辑重提"绕过管理员的下架决定。
        </div>
        <div class="status-banner sb-off" style="margin-bottom:0">下架原因：${esc(a.reviewNote || '（未填写）')}</div>
      </div>
    </div>`;
  }
  if(!canEditArticle(a)) return notFoundHTML('该帖当前状态不可编辑');

  /* 顶部提示条按原状态给不同文案（PRD §5.3.3） */
  let tip = '';
  if(a.status === 0) tip = `<div class="status-banner sb-wait">该帖正在审核中。保存后将重新提交审核。</div>`;
  if(a.status === 1) tip = `<div class="status-banner sb-wait">该帖已发布。保存后将<b>重新进入审核，通过前会暂时从社区隐藏</b>；期间的浏览 / 点赞 / 收藏 / 评论都会保留。</div>`;
  if(a.status === 2) tip = `<div class="status-banner sb-rej">该帖未通过审核：<b>${esc(a.reviewNote || '（未填写理由）')}</b>。修改后可重新提交，保存后原驳回理由将被清除。</div>`;
  if(a.status === 3) tip = `<div class="status-banner sb-off">该帖已被你删除（作者自删）。保存后将重新提交审核。</div>`;

  return `
  <div class="form-wrap">
    <a class="back-link" href="javascript:go('my')">← 返回我的文章</a>
    ${tip}
    <div class="card card-pad" style="padding:24px">
      <h2 style="font-size:19px;font-weight:800;margin-bottom:6px">编辑文章 <span class="pv-note">#${a.id}</span></h2>
      <div class="muted" style="font-size:13px;margin-bottom:22px">
        保存后状态一律变为<b>待审核</b>，需管理员重新审核通过才重新公开。
      </div>

      <div class="field">
        <label>选择板块<span class="req">*</span></label>
        ${catPickHTML(state.editCat)}
      </div>
      <div class="field">
        <label>标题<span class="req">*</span></label>
        <input class="inp" maxlength="100" value="${esc(state.editTitle ?? a.title)}"
               oninput="state.editTitle=this.value;updateSubmit('edit')">
      </div>
      <div class="field">
        <label>封面<span class="tip">选填</span></label>
        ${state.editCover === ''
          ? `<div class="cover-box" onclick="state.editCover='yes';render()" style="cursor:pointer;text-align:center">
               <div style="font-weight:600;color:var(--text-2)">点击上传封面</div>
             </div>`
          : `<div class="cover-box cover-prev">
               <div class="thumb"><img src="${pixCover(coverSeed(state.editCat) + 3)}" alt=""></div>
               <div style="flex:1"><div style="font-weight:600">cover-20260927-002.png</div>
                 <div class="muted" style="font-size:12.5px">当前封面</div></div>
               <button class="btn btn-sm btn-danger" onclick="state.editCover='';render()">移除</button>
             </div>`}
      </div>
      <div class="field">
        <label>正文<span class="req">*</span></label>
        ${mdEditorHTML(state.editContent ?? a.content, 'edit-md')}
      </div>
      <div class="field">
        <label>标签<span class="tip">最多 5 个</span></label>
        ${tagEditorHTML(state.editTags)}
      </div>

      <div class="form-foot">
        <button class="btn" onclick="go('my')">取消</button>
        <button class="btn btn-pri btn-lg" id="edit-submit" onclick="submitEdit(${a.id})">保存并重新提交审核</button>
      </div>

  </div>`;
}

/* 点赞 / 收藏（PRD §0.3-C：第一阶段最小可用，幂等切换） */
function toggleLike(id){
  if(!requireLogin('点赞')) return;
  const a = getArticle(id), key = state.user + ':' + id;
  if(LIKES.has(key)){ LIKES.delete(key); a.likeCount = Math.max(0, a.likeCount - 1); }
  else { LIKES.add(key); a.likeCount++; }
  render();
  toast(LIKES.has(key) ? '已点赞' : '已取消点赞');
}
function toggleFav(id){
  if(!requireLogin('收藏')) return;
  const a = getArticle(id), key = state.user + ':' + id;
  if(FAVS.has(key)){ FAVS.delete(key); a.favoriteCount = Math.max(0, a.favoriteCount - 1); }
  else { FAVS.add(key); a.favoriteCount++; }
  render();
  toast(FAVS.has(key) ? '已收藏' : '已取消收藏');
}
function share(id){
  /* 原型里不做真实剪贴板写入，仅演示交互反馈 */
  const t = '链接已复制：' + location.href.split('#')[0] + '#/forum/post/' + id;
  toast(t);
}

/* 演示用递增时间戳（保证排序稳定；真实实现由后端生成） */
function nextDemoTime(){
  state.draftTime = state.draftTime + 1;
  const m = 20 + Math.floor(state.draftTime / 60), s = state.draftTime % 60;
  return '2026-09-27T' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + ':00';
}
function submitComment(articleId){
  if(!requireLogin('发表评论')) return;
  const box = $('cmt-box');
  if(!box) return;
  const txt = (box.value || '').trim();
  if(!txt){ toast('评论内容不能为空', 'warn'); return; }
  if(txt.length > 500){ toast('评论不能超过 500 字', 'warn'); return; }
  COMMENTS.push({id:nextCommentId++, articleId, parentId:0, authorId:me().id, likeCount:0,
                 replyToUserId:0, content:txt, createTime:nextDemoTime(), status:1});
  recountCommentCount();
  render();
  toast('评论已发表', 'ok');
}

/* ── 评论点赞（PRD §4.5.3：顶层评论与回复通用，幂等切换） ── */
function toggleCommentLike(cid){
  if(!requireLogin('点赞')) return;
  const c = COMMENTS.find(x => x.id === cid);
  if(!c) return;
  const key = state.user + ':' + cid;
  if(COMMENT_LIKES.has(key)){ COMMENT_LIKES.delete(key); c.likeCount = Math.max(0, c.likeCount - 1); }
  else { COMMENT_LIKES.add(key); c.likeCount++; }
  render();
  toast(COMMENT_LIKES.has(key) ? '已点赞' : '已取消点赞');
}

/* ── 回复：只在一条评论的"正下方"展开，且同时只允许一个（PRD §5.4.3） ── */
function openReply(commentId){
  if(!requireLogin('回复')) return;
  const c = COMMENTS.find(x => x.id === commentId);
  if(!c) return;
  /* 顶层评论 → parentId 即自身；回复 → parentId 取其所属顶层评论，不产生第三级（§8-D15） */
  state.replyTo = {
    parentId: c.parentId || c.id,
    replyToUserId: c.authorId,
    replyToName: userOf(c.authorId).name,
    afterId: commentId
  };
  render();
  const box = $('reply-box');
  if(box && box.focus) box.focus();
}
function cancelReply(){ state.replyTo = null; render(); }
function submitReply(parentId, replyToUserId){
  if(!requireLogin('发表回复')) return;
  const box = $('reply-box');
  if(!box) return;
  const txt = (box.value || '').trim();
  if(!txt){ toast('回复内容不能为空', 'warn'); return; }
  if(txt.length > 500){ toast('回复不能超过 500 字', 'warn'); return; }
  const parent = COMMENTS.find(x => x.id === parentId);
  if(!parent) return;
  COMMENTS.push({id:nextCommentId++, articleId:parent.articleId, parentId, authorId:me().id,
                 likeCount:0, replyToUserId, content:txt, createTime:nextDemoTime(), status:1});
  state.replyTo = null;
  recountCommentCount();
  render();
  toast('回复已发表', 'ok');
}

/* ── 表单辅助 ── */
function pickCat(code){
  if(state.view === 'edit') state.editCat = code;
  else state.draft.cat = code;
  render();
}
function addTag(name){
  const v = (name || '').trim();
  if(!v) return;
  const arr = state.view === 'edit' ? state.editTags : state.draft.tags;
  if(arr.length >= 5){ toast('最多只能添加 5 个标签', 'warn'); return; }
  if(arr.includes(v)){ toast('该标签已添加', 'warn'); return; }
  if(v.length > 20){ toast('单个标签不超过 20 字', 'warn'); return; }
  arr.push(v);
  render();
}
function rmTag(i){
  const arr = state.view === 'edit' ? state.editTags : state.draft.tags;
  arr.splice(i,1); render();
}
function mdWrap(id, pre, post){
  const el = $(id); if(!el) return;
  const s = el.selectionStart, e = el.selectionEnd;
  el.value = el.value.slice(0,s) + pre + el.value.slice(s,e) + post + el.value.slice(e);
  el.focus(); el.selectionStart = el.selectionEnd = e + pre.length + post.length;
  syncMD(id);
}
function syncMD(id){
  const el = $(id); if(!el) return;
  if(state.view === 'edit') state.editContent = el.value;
  else state.draft.content = el.value;
  const pv = $(id + '-pv-body');
  if(pv) pv.innerHTML = renderMD(el.value);
  updateSubmit();
}
function togglePv(id){
  const pv = $(id + '-pv'), ta = $(id), box = pv.parentElement;
  const on = pv.style.display === 'none';
  syncMD(id);
  pv.style.display = on ? 'block' : 'none';
  ta.style.display = on ? 'none' : 'block';
}
function updateSubmit(mode){
  if(mode === 'edit') return;
  const d = state.draft;
  const btn = $('submit-btn'); if(!btn) return;
  btn.disabled = !(d.cat && d.title.trim().length >= 2 && d.content.trim().length >= 10);
}

/* ── 发布 ── */
function submitCreate(){
  if(!requireLogin('发布文章')) return;
  const d = state.draft;
  if(!d.cat){ toast('请选择板块', 'warn'); return; }
  if(d.title.trim().length < 2){ toast('标题至少 2 个字', 'warn'); return; }
  if(d.content.trim().length < 10){ toast('正文至少 10 个字', 'warn'); return; }
  const now = '2026-09-27T19:11:00';
  d.tags.forEach(t => { if(!TAGS.find(x => x.name === t)) TAGS.push({id:nextTagId++, name:t, useCount:0, isHot:0, source:'user'}); });
  const a = {
    id:nextArticleId++, cat:d.cat, authorId:me().id, title:d.title.trim(),
    tags:d.tags.slice(), cover:d.cover ? 'g1' : '', content:d.content,
    summary:'', status:0, isTop:0, isFeatured:0, viewCount:0, likeCount:0,
    favoriteCount:0, commentCount:0, publishTime:'', createTime:now, updateTime:now,
    reviewNote:'', removeBy:'', resubmitCount:0
  };
  ARTICLES.push(a);
  state.draft = {cat:'', title:'', cover:'', content:'', tags:[]};
  go('my');
  toast('已提交，等待审核', 'ok');
}

/* ── 编辑 ── */
function startEdit(id){
  const a = getArticle(id);
  if(!a){ toast('帖子不存在', 'err'); return; }
  if(!canEditArticle(a)){
    toast('该帖已被管理员下架，请联系管理员处理', 'err');
    return;
  }
  state.editId = id;
  state.editCat = a.cat;
  state.editTitle = a.title;
  state.editContent = a.content;
  state.editCover = a.cover || '';
  state.editTags = (a.tags || []).slice();
  go('edit', id);
}
function submitEdit(id){
  const a = getArticle(id);
  if(!a) return;
  const title = (state.editTitle ?? a.title).trim();
  const content = (state.editContent ?? a.content);
  if(title.length < 2){ toast('标题至少 2 个字', 'warn'); return; }
  if(content.trim().length < 10){ toast('正文至少 10 个字', 'warn'); return; }

  const wasPublished = a.status === 1;
  /* 编辑重提：状态回待审核，清空 review_note / publish_time / remove_by，resubmit_count+1（PRD §4.3） */
  a.cat = state.editCat || a.cat;
  a.title = title;
  a.content = content;
  a.cover = state.editCover ? 'g1' : '';
  a.tags = state.editTags.slice();
  a.status = 0;
  a.reviewNote = '';
  a.publishTime = '';
  a.removeBy = '';
  a.resubmitCount = (a.resubmitCount || 0) + 1;
  a.updateTime = '2026-09-27T19:12:00';

  /* 新标签自动入库 */
  a.tags.forEach(t => { if(!TAGS.find(x => x.name === t)) TAGS.push({id:nextTagId++, name:t, useCount:0, isHot:0, source:'user'}); });
  recountTagUse();   /* 离开 status=1 → 标签使用数 -1（单一转移点规则） */

  go('my');
  toast(wasPublished
    ? '已重新提交；通过审核前该帖暂时不在社区显示'
    : '已重新提交，等待审核', 'ok');
}

/* ── 删除（作者自删 → status=3, remove_by='author'） ── */
function askDelete(id){
  const a = getArticle(id); if(!a) return;
  openModal('删除这篇帖子？', '删除后该帖会从社区移除（软删除，数据保留）。如果之后想恢复，可以在「我的文章」重新编辑提交。', '确认删除', () => {
    a.status = 3; a.removeBy = 'author'; a.updateTime = '2026-09-27T19:13:00';
    recountTagUse();
    closeOverlay(); render();
    toast('已删除', 'ok');
  }, true);
}

function adminTop(id){ const a = getArticle(id); a.isTop = a.isTop ? 0 : 1; render(); toast(a.isTop ? '已置顶' : '已取消置顶'); }
function adminFeature(id){ const a = getArticle(id); a.isFeatured = a.isFeatured ? 0 : 1; render(); toast(a.isFeatured ? '已加精' : '已取消精华'); }

/* ── 评论抽屉（PRD §6.1.5：两级结构、删除连带、只删不参与） ── */
function cmtDrawerRowHTML(c, isReply){
  const u = userOf(c.authorId);
  const repCount = isReply ? 0 : COMMENTS.filter(x => x.parentId === c.id && x.status === 1).length;
  return `<div class="cmt${isReply ? ' reply' : ''}">
    <div class="avatar ${isReply ? 'av-28' : 'av-32'} ${u.av || ''}">${esc(u.avatar)}</div>
    <div class="cmt-body">
      <div class="cmt-head">
        <span class="nm">${esc(u.name)}</span>
        <span>· ${relTime(c.createTime)}</span>
        ${isReply ? '<span class="badge b-off">回复</span>' : ''}
        ${c.status === 2 ? '<span class="badge b-off">已删除</span>' : ''}
      </div>
      <div class="cmt-text">${isReply && c.replyToUserId
        ? `<span class="reply-to">回复 @${esc(userOf(c.replyToUserId).name)}</span> ` : ''}${esc(c.content)}</div>
      <div class="cmt-acts">
        <span class="muted" style="font-size:12.5px">赞 ${c.likeCount}</span>
        ${c.status === 2 ? '' : `<button class="link-op dg" onclick="askDelComment(${c.id})">
          ${repCount ? '删除（含 ' + repCount + ' 条回复）' : '删除'}</button>`}
      </div>
    </div>
  </div>`;
}
function openComments(articleId){
  const a = getArticle(articleId); if(!a) return;
  const tops = COMMENTS.filter(c => c.articleId === articleId && !c.parentId)
                       .sort((x,y) => y.createTime.localeCompare(x.createTime));
  const body = tops.length ? tops.map(t => {
    const reps = COMMENTS.filter(x => x.parentId === t.id)
                         .sort((x,y) => x.createTime.localeCompare(y.createTime));
    return cmtDrawerRowHTML(t, false) + reps.map(r => cmtDrawerRowHTML(r, true)).join('');
  }).join('') : '<div class="empty" style="margin-top:20px">该帖暂无评论</div>';
  $('drawer').innerHTML = `
    <div class="drawer-hd">
      <div>
        <h3>评论管理</h3>
        <div class="muted" style="font-size:12.5px;margin-top:2px">
          ${esc(a.title)} · 顶层 ${tops.length} 条 / 含回复共 ${a.commentCount} 条
        </div>
      </div>
      <button class="btn btn-sm" onclick="closeOverlay()">关闭</button>
    </div>
    <div class="drawer-bd">${body}</div>`;
  $('drawer').className = 'drawer show';
  $('mask').className = 'mask show';
}
function askDelComment(cid){
  const c = COMMENTS.find(x => x.id === cid); if(!c || c.status === 2) return;
  const reps = COMMENTS.filter(x => x.parentId === cid && x.status === 1);
  const tip = reps.length
    ? `这是<b>顶层评论</b>，删除后其下 <b>${reps.length} 条回复</b>会一并删除，文章评论数减去 <b>${1 + reps.length}</b>。`
    : (c.parentId ? '删除这条<b>回复</b>后，文章评论数减去 1。' : '删除后文章评论数减去 1。');
  openModal('删除这条评论？', tip + '<br>评论点赞记录会同步清理，不留孤儿数据。', '确认删除',
    () => { delComment(cid); }, {danger:true, needInput:false});
}
function delComment(cid){
  const c = COMMENTS.find(x => x.id === cid); if(!c || c.status === 2) return;
  /* 顶层评论 → 其下回复一并软删（PRD §6.1.5）；两种情况都清理评论点赞行（§4.5.3） */
  const all = [c].concat(COMMENTS.filter(x => x.parentId === cid));
  all.forEach(x => {
    x.status = 2;
    Array.from(COMMENT_LIKES).forEach(k => {
      if(k.split(':')[1] === String(x.id)) COMMENT_LIKES.delete(k);
    });
  });
  recountCommentCount();
  openComments(c.articleId);   /* 刷新抽屉 */
  toast(all.length > 1
    ? `已删除顶层评论及其 ${all.length - 1} 条回复，评论数已同步`
    : '评论已删除，评论数已同步', 'ok');
}

/* ── 板块 / 标签 ── */
function toggleCatHide(code){
  const c = catOf(code);
  c.isHidden = c.isHidden ? 0 : 1;
  if(state.category === code && c.isHidden) state.category = 'home';
  render();
  toast(c.isHidden ? '已隐藏，标签栏不再显示' : '已恢复显示');
}
function delCat(code){
  const i = CATS.findIndex(c => c.code === code);
  if(i < 0) return;
  if(CATS[i].isSystem){ toast('系统板块不可删除', 'err'); return; }
  if(ARTICLES.some(a => a.cat === code)){ toast('该板块下仍有文章，无法删除', 'err'); return; }
  CATS.splice(i,1); render(); toast('板块已删除', 'ok');
}
function toggleTagHot(id){
  const t = TAGS.find(x => x.id === id); t.isHot = t.isHot ? 0 : 1;
  render(); toast(t.isHot ? '已置为热门标签' : '已取消置热');
}
function askMerge(id){
  const src = TAGS.find(x => x.id === id);
  const others = TAGS.filter(t => t.id !== id);
  openModal('合并标签「' + src.name + '」', '源标签的引用会全部迁移到目标标签，然后源标签被删除。', '确认合并',
    () => {
      /* 原型演示：合并到使用数最高的其他标签 */
      const target = others.slice().sort((a,b) => b.useCount - a.useCount)[0];
      if(!target){ toast('没有可合并的目标标签', 'err'); return; }
      ARTICLES.forEach(a => {
        if(a.tags && a.tags.includes(src.name))
          a.tags = Array.from(new Set(a.tags.map(t => t === src.name ? target.name : t)));
      });
      TAGS = TAGS.filter(t => t.id !== id);
      recountTagUse(); closeOverlay(); render();
      toast(`已合并到「${target.name}」`, 'ok');
    }, {needInput:false});
}
function delTag(id){
  const t = TAGS.find(x => x.id === id); if(!t) return;
  ARTICLES.forEach(a => {
    if(a.tags && a.tags.includes(t.name)) a.tags = a.tags.filter(x => x !== t.name);
  });
  TAGS = TAGS.filter(x => x.id !== id);
  recountTagUse(); render(); toast('标签已删除', 'ok');
}

/* ── 配置 ── */
function saveConfig(){
  CONFIG.bannerTitle = ($('cfg-title').value || '').trim() || CONFIG.bannerTitle;
  CONFIG.bannerSubtitle = ($('cfg-sub').value || '').trim();
  CONFIG.defaultSort = $('cfg-sort').value;
  CONFIG.searchPlaceholder = ($('cfg-ph').value || '').trim();
  state.sort = CONFIG.defaultSort;
  render();
  toast('配置已保存，首页即时生效', 'ok');
}

/* ── 用户管理 ── */
function askMute(id){
  const u = USER_LIST.find(x => x.id === id);
  openModal('禁言「' + u.nickname + '」', '禁言期间该用户仍可登录浏览，但<b>不能发帖、评论或上传图片</b>。留空表示永久禁言。', '确认禁言',
    v => {
      const days = parseInt(v, 10);
      const until = (isNaN(days) || days <= 0) ? '永久' : days + ' 天后';
      u.muteUntil = until;
      closeOverlay(); render();
      toast('已禁言：' + u.nickname, 'ok');
    }, {danger:true, needInput:true, ph:'禁言天数，例如 3、7、30；留空 = 永久'});
}
function setMute(id, val){
  const u = USER_LIST.find(x => x.id === id);
  u.muteUntil = val;
  render();
  toast('已解除禁言：' + u.nickname, 'ok');
}
function showUserStats(id){
  const u = USER_LIST.find(x => x.id === id);
  const mine = ARTICLES.filter(a => a.authorId === id);
  const pub = mine.filter(a => a.status === 1);
  const likes = mine.reduce((s,a) => s + a.likeCount, 0);
  const recent = mine.slice(0,5);
  openModal('「' + u.nickname + '」论坛数据',
    `<div class="kv" style="grid-template-columns:96px 1fr">
       <span class="k">发帖数</span><span>${pub.length} 篇（全部 ${mine.length} 篇）</span>
       <span class="k">获赞数</span><span>${likes}</span>
       <span class="k">粉丝数</span><span>0 <span class="muted">（关注体系第二阶段上线）</span></span>
     </div>
     <div class="sep"></div>
     <div style="font-weight:700;font-size:13px;margin-bottom:8px">最近发帖</div>
     ${recent.length ? recent.map(a => {
       const st = statusMeta(a);
       return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:13px">
         <span class="badge ${st.cls}">${st.label}</span>
         <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.title)}</span></div>`;
     }).join('') : '<div class="muted" style="font-size:13px">暂无发帖</div>'}`,
    '知道了', () => closeOverlay(), {needInput:false});
}

/* ════════════════════════════════════════════════════════════════
   12. 弹窗 / 遮罩
   ════════════════════════════════════════════════════════════════ */

let modalCb = null;
function openModal(title, descHTML, okLabel, cb, opts){
  opts = opts || {};
  modalCb = cb;
  $('modal').innerHTML = `
    <div class="modal-hd">${esc(title)}</div>
    <div class="modal-bd">
      <div class="muted2" style="font-size:13.5px;line-height:1.75;${opts.needInput === false ? '' : 'margin-bottom:14px'}">${descHTML}</div>
      ${opts.needInput ? `<textarea class="inp" id="modal-ta" style="min-height:78px" placeholder="${esc(opts.ph || '')}"></textarea>` : ''}
    </div>
    <div class="modal-ft">
      <button class="btn" onclick="closeOverlay()">取消</button>
      <button class="btn ${opts.danger ? 'btn-danger' : 'btn-pri'}" onclick="modalOk()">${esc(okLabel)}</button>
    </div>`;
  $('modal').className = 'modal show';
  $('mask').className = 'mask show';
}
function modalOk(){
  const ta = $('modal-ta');
  const v = ta ? ta.value.trim() : '';
  if(ta && !v){ toast('请填写内容', 'warn'); return; }
  if(modalCb) modalCb(v);
}
function closeOverlay(){
  $('mask').className = 'mask';
  $('modal').className = 'modal';
  $('drawer').className = 'drawer';
  modalCb = null;
}

/* ════════════════════════════════════════════════════════════════
   13. 启动
   ════════════════════════════════════════════════════════════════ */

render();
</script>
