# ============================================================================
# 星穹旅驿官网 · 全栈编排（本文件位于项目根目录）
#
#   xqly-website-backend  FastAPI 后端（:5000，容器内网；对外只绑回环）
#   xqly-website-web      统一前端 nginx：/ 主站 · /admin/ 后台 · /wiki/ 文档，
#                         并反代 /api → xqly-website-backend:5000（web/Dockerfile）
#
# 启动（本地/测试）：docker compose up -d --build
# 入口：http://127.0.0.1:8090/（测试环境用根目录 .env 的 WEB_BIND_IP=0.0.0.0 开放局域网）
#
# ⚠️ 与生产部署的关系：
#   生产镜像由 GitHub Actions（.github/workflows/release-images.yml）在 Release 时
#   构建并推送到 GHCR（-backend / -web 两个镜像）；服务器**只拉取运行，不在服务器构建**
#   （2C2G 跑前端 Vite 构建会 OOM）：
#       docker compose pull && docker compose up -d --no-build
#   web 容器生产只绑 127.0.0.1:8090（WEB_BIND_IP 默认值），由 1panel/OpenResty
#   按域名反代对外；禁止在生产直接绑 0.0.0.0。
#   build 段保留给本地/测试构建（image 与 build 共存：build 产物按 image 名打 tag）。
#   生产定时任务仍按 for-deploy/crontab 在宿主机 docker exec 执行，依赖
#   container_name: xqly-website-backend，勿改名。
# ============================================================================
services:
  xqly-website-backend:
    build:
      # 构建上下文 = 项目根目录（本文件已从 backend/ 迁到根目录，原 context: .. 失效）。
      # backend/Dockerfile 里的 COPY backend/requirements.txt / COPY backend/ 依赖该路径。
      context: .
      dockerfile: backend/Dockerfile
    # 镜像名：本地 build 会按此名打 tag；生产直接 pull 该镜像（见文件头部署说明）。
    # 测试环境可在根目录 .env 设 IMAGE_PREFIX=server-website-xqly-website 复用本地构建镜像。
    image: ${IMAGE_PREFIX:-ghcr.io/chaossurvivalproject/server-website}-backend:${IMAGE_TAG:-latest}
    container_name: xqly-website-backend
    environment:
      - ANNOUNCEMENT_DB=/app/data/announcements.db
      # 公告时间按北京时间存储/展示，容器默认 UTC 会再差 8 小时
      - TZ=Asia/Shanghai
      # 富文本图片上传目录（需指向挂载卷，随数据一起持久化）
      - ANNOUNCEMENT_UPLOAD_DIR=/app/data/uploads
      # 容器内 wiki 挂载点固定为 /app/wiki。环境变量优先于 .env 文件值
      # （config.py 启动期口径），可纠正本地 backend/.env 里 KB_WIKI_DIR=../wiki
      # 这种按宿主机路径写的值；生产 .env 若已写 /app/wiki，此覆盖也无害。
      - KB_WIKI_DIR=/app/wiki
    volumes:
      # SQLite 与上传图片（gitignore，不入镜像，见根 .dockerignore 的 backend/data）
      - ./backend/data:/app/data
      # 含 API Key 的配置（backend/.env 已 gitignore，不随镜像发布；
      # 缺文件时 config.py 会静默降级，故部署前必须确保该文件存在）。
      # 生产改挂 /opt/xqly-website/backend/.env:/app/backend/.env:ro
      - ./backend/.env:/app/backend/.env:ro
      # 知识库单一数据源：仓库 wiki/ 源码（kb_sync.py 按 MD5 增量入库，只读挂载）
      - ./wiki:/app/wiki:ro
    ports:
      # 默认只绑回环，便于宿主机直接调试接口、以及与生产 crontab 的
      # docker exec 习惯一致（容器名/路径都不变）。生产若不需要宿主机端口，
      # 删掉本段即可——web 服务经 compose 内网反代，不依赖此映射。
      # ⚠️ 勿改绑 0.0.0.0：Docker 的 iptables 规则会绕过 ufw，把 API 直接暴露公网。
      - "127.0.0.1:5000:5000"
    healthcheck:
      # 容器内探活（/health 为无依赖轻量路由）；web 服务按健康状态决定启动顺序
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  xqly-website-web:
    build:
      # 统一前端镜像：三个前端在 web/Dockerfile 多阶段构建里各自编译，
      # 产物收进一个 nginx 并按生产拓扑分发（web/nginx.conf）。
      context: .
      dockerfile: web/Dockerfile
    image: ${IMAGE_PREFIX:-ghcr.io/chaossurvivalproject/server-website}-web:${IMAGE_TAG:-latest}
    container_name: xqly-website-web
    ports:
      # host_ip 由 WEB_BIND_IP 控制：默认 127.0.0.1（生产安全，由 1panel/OpenResty
      # 按域名反代到该端口）；本机测试环境在根目录 .env 设 WEB_BIND_IP=0.0.0.0
      # 供局域网访问。生产禁止直接绑 0.0.0.0（会绕过 ufw 暴露公网）。
      # 8080 已被宿主机其他服务占用，故用 8090。
      - "${WEB_BIND_IP:-127.0.0.1}:8090:80"
    depends_on:
      xqly-website-backend:
        condition: service_healthy
    restart: unless-stopped
