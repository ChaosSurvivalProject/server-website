services:
  announcement-backend:
    build:
      # 构建上下文为项目根目录（Dockerfile 中 COPY backend/ 依赖该路径）
      context: ..
      dockerfile: backend/Dockerfile
    container_name: announcement-backend
    ports:
      # 只绑回环：生产是 1panel 的 openresty（host 网络）反代 127.0.0.1:5000，
      # 发布到 0.0.0.0 会被 Docker 的 iptables 规则绕过 ufw，把 API 直接暴露到公网
      - "127.0.0.1:5000:5000"
    environment:
      - ANNOUNCEMENT_DB=/app/data/announcements.db
      # 公告时间按北京时间存储/展示，容器默认 UTC 会再差 8 小时
      - TZ=Asia/Shanghai
      # 富文本图片上传目录（需指向挂载卷，随数据一起持久化）
      - ANNOUNCEMENT_UPLOAD_DIR=/app/data/uploads
    volumes:
      - ./data:/app/data
      # 含 API Key 的配置（backend/.env 已 gitignore，不随镜像发布；
      # 缺文件时 config.py 会静默降级，故部署前必须确保该文件存在）
      - ./.env:/app/backend/.env:ro
      # 知识库单一数据源：仓库 wiki/ 源码（kb_sync.py 按 MD5 增量入库，只读挂载）
      - ../wiki:/app/wiki:ro
    restart: unless-stopped
