<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>页面不存在 | 星穹旅驿</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1f2933;
        --muted: #55606b;
        --bg: #f5f7f8;
        --card: #ffffff;
        --line: #d8dee3;
        --accent: #2e7d32;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e8edf0;
          --muted: #9aa7b1;
          --bg: #11151a;
          --card: #1b2229;
          --line: #313b44;
          --accent: #81c784;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      main {
        width: 100%;
        max-width: 560px;
        padding: 32px 28px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        text-align: center;
      }
      h1 { font-size: 40px; margin: 0 0 12px; }
      p { color: var(--muted); line-height: 1.7; margin: 0 0 20px; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      a {
        display: inline-block;
        padding: 10px 18px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        color: var(--accent);
        text-decoration: none;
      }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>
        这个页面不存在或已被移动。你可以回到首页，或直接前往文档站查找进服指南、
        阵营规则与服务状态。
      </p>
      <nav>
        <a href="/">返回首页</a>
        <a href="/wiki/">Wiki 文档</a>
        <a href="/wiki/for-new/quick-start/">进服指南</a>
        <a href="/wiki/about/service-status/">服务状态</a>
      </nav>
    </main>
  </body>
</html>
