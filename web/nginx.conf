# 星穹旅驿官网 · 统一前端容器 nginx 路由
#
# 路由规则与生产 1panel 站点一致（生产留档见 for-deploy/xqly-app.conf，
# 该文件由 1panel OpenResty host 网络加载；本文件跑在 web 容器里，
# 用于自包含部署 / 本地整栈联调）。两处改动须同步维护：
#   ⚠️ 改一改二：新增 / 删除 / 改名任何 location，必须同时改本文件与
#   for-deploy/xqly-app.conf（后者是与线上字节一致的生产快照，需先在服务器改、
#   验证 nginx -t && reload 后再回拷留档，见 for-deploy/README.md）。
#   校验两套 location 集合是否一致：
#     diff <(grep -E '^[[:space:]]*location[[:space:]]' web/nginx.conf | sed -E 's/^[[:space:]]+//; s/[[:space:]]+\{$//' | sort) \
#          <(grep -E '^[[:space:]]*location[[:space:]]' for-deploy/xqly-app.conf | sed -E 's/^[[:space:]]+//; s/[[:space:]]+\{$//' | sort)
#   新增 location 前缀时不得与前端页面路由同名（如 location /staff 会把
#   SPA 的 /staff/:code 页面一并反代走），详见 AGENTS.md 部署拓扑一节。
#
# 静态产物由 web/Dockerfile 归位：
#   /usr/share/nginx/html/        = frontend（主站，vite-ssg 预渲染 + 少量 SPA 动态路由，站点根）
#   /usr/share/nginx/html/admin/  = admin-frontend
#   /usr/share/nginx/html/wiki/   = wiki（VitePress）

upstream backend {
    # compose 网络里的 FastAPI 容器（后端只在内网监听 5000，不发布端口到宿主机）。
    # 主机名 = compose 服务名 xqly-website-backend（改动须与 docker-compose.yml 同步）
    server xqly-website-backend:5000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # FLPR-63：不存在的路径返回真 404（由 frontend/public/404.html 提供），
    # 不再无差别 history fallback 到首页产生大量重复内容
    error_page 404 /404.html;

    # 静态资源协商缓存（含 Minecraft 字体 otf/ttf）；正则 location 优先于
    # location /，但低于 ^~ /api/ —— 不会截走接口请求
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?|otf|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 文本类静态资源开 gzip（镜像内构建产物未预压缩，VITE_COMPRESSION=none）
    gzip on;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/xml text/plain application/wasm;

    # 智能客服 KB：SSE 流式接口。必须关缓冲 + HTTP/1.1 空连接头 + 关 gzip
    # （与后端 X-Accel-Buffering: no 两个都要，否则流式变一次性返回）。
    # 前缀最长匹配优先，/api/kb/* 全量命中本块。
    location ^~ /api/kb/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # API 反代到 FastAPI（后端所有接口统一挂 /api 前缀）。
    # ^~ 前缀匹配优先于上方静态资源正则，保证 /api/* 全量命中反代。
    location ^~ /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        # 公告 / 论坛图片上传接口的体积上限（生产 OpenResty 默认 1M，过小）
        client_max_body_size 20m;
    }

    # 旧路径兼容（勿删）：
    # /health —— 外部监控/旧部署门禁仍在用（后端保留 /health 旧路由）
    location = /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # /announcement/uploads/ —— 历史公告正文内嵌的旧图片 URL（存量数据兼容）
    location ^~ /announcement/uploads/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 资源中心下载跳转端点（不挂 /api：浏览器地址栏直达的 302 跳转 URL）。
    # 前缀与前端页面路由不同名（页面是 /resources，这里是 /download），无冲突。
    location ^~ /download/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /admin 与 /wiki 目录跳转（相对 Location，浏览器自行保留协议与端口）
    location = /admin {
        return 301 /admin/;
    }
    location = /wiki {
        return 301 /wiki/;
    }

    # Wiki cleanUrls：无后缀 clean 链接先命中 xxx.html，再目录；未命中回落 VitePress 404 页
    location /wiki/ {
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /wiki/404.html;
    }

    # 预渲染产物：真实 .html / 目录 index.html 优先命中；命中不了只走真 404。
    # ⚠️ 不要退回 `try_files $uri $uri/ /index.html`：那样所有内页都回退到首页 HTML，
    #    浏览器里看着正常（JS 会把内容切回来），但「查看源代码」和爬虫只看到空壳。
    location / {
        try_files $uri $uri.html $uri/index.html @not_found;
    }

    # 仍留在客户端渲染的动态路由：登录 / 注册（不预渲染、不进 sitemap），
    # 以及按用户或接口取数的详情路由（/staff/:code、/forum/*、/resources/*）。
    # 这些路径保留 SPA 兜底，但静态页存在时仍优先吃预渲染产物。
    location ~ ^/(login|register|staff|forum|resources)(/|$) {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    location @not_found {
        return 404;
    }
}
